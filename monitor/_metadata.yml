# Settings shared by every page in the Monitor folder.
#
# The filter issue.lua turns an issue into its web page: the facts at the top,
# the PDF's page numbers in the margin, the "How to cite" box and the data that
# Google Scholar reads. It only acts on a page whose header has the line "issue:".
filters:
  - ../_templates/issue.lua
# The filter writes the citation data itself, so Quarto's own are switched off.
google-scholar: false
citation: false
license: "CC BY"
# The PDF of an issue is copied to the site next to its web page.
resources:
  - "*.pdf"
# The filter reads the day of publication in the form year-month-day.
date-format: iso
toc: true
toc-depth: 3
toc-expand: true
