name: Workspace server

# The Researcher's Workspace server (folder server/), master plan, section 9.
# At every push that changes the server, the attack tests run first. The server
# goes online only when every attack has failed. Until the editor has set up
# Cloudflare (the GitHub variable WORKSPACE_DEPLOY is "on"), only the tests run.
#
# The keys are read from the repository's secret settings at GitHub
# (Settings, Secrets and variables, Actions). None of them is in this file.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-server
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  attack-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the exact versions in package-lock.json
        run: npm ci --legacy-peer-deps
      - name: Run the attack tests (every attack must fail)
        run: npm test

  deploy:
    needs: attack-tests
    if: vars.WORKSPACE_DEPLOY == 'on'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - name: Name the database
        run: sed -i "s/__D1_DATABASE_ID__/${{ vars.D1_DATABASE_ID }}/" wrangler.jsonc
      - name: Bring the database up to date
        run: npx wrangler d1 migrations apply populiverse-workspace --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Put the server online, with its keys
        run: |
          node -e '
            const keys = ["BETTER_AUTH_SECRET","ORCID_CLIENT_ID","ORCID_CLIENT_SECRET","SENDER_API_KEY","SENDER_GROUP_ID","ROR_CLIENT_ID"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync("/tmp/keys.json", JSON.stringify(out), { mode: 0o600 });
          '
          npx wrangler deploy --secrets-file /tmp/keys.json
          rm -f /tmp/keys.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
          SENDER_API_KEY: ${{ secrets.SENDER_API_KEY }}
          SENDER_GROUP_ID: ${{ secrets.SENDER_GROUP_ID }}
          ROR_CLIENT_ID: ${{ secrets.ROR_CLIENT_ID }}
