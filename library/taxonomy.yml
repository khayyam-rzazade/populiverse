# PopuliVerse Library: the controlled vocabulary (the "codebook").
# Version 3, 2026-10-02 (version 2: 2026-10-01; version 1: 2026-09-30). Master plan, section 5.
# New in version 3: the type "Book review".
#
# This file lists every tag the Library is allowed to use.
# Lines that start with # are notes for people. The scripts ignore them.
#
# HOW TO READ AN ENTRY
#   tag         what is typed in Zotero, exactly as written here
#   label       the name shown on the site
#   definition  one line saying what belongs under the tag
#
# THE THREE RULES OF THIS FILE
#   1. A tag that is not in this file is a mistake, not a new category.
#      To add a category: add it here first, then use it.
#   2. A tag is permanent once it is in use. Renaming it means re-tagging
#      every entry that carries it, and it breaks links people have shared.
#      The label and the definition can be changed at any time.
#   3. Tags are lowercase, with hyphens and no spaces.
#
# HOW ENTRIES ARE TAGGED (rules of 2026-10-01)
#   A tag is given only when the work's own record supports it: its title, its
#   abstract, or the catalogue record (for type and open access). Nothing is
#   guessed. The wordings that count as evidence are in phrases.yml and
#   actors.yml, next to this file. A work can stay untagged on an axis.
#   The only tag every entry must have is its type.
#   approach  The way the work itself defines populism. Two approaches: both
#             tags. Three or more: approach:other. None stated: no approach tag.
#   topic     Every topic that is central to the work, usually one to three.
#             Elections have no tag of their own: topic:parties if the work
#             explains what the actors did, topic:voters if it explains how
#             people voted, both if it does both.
#   region    One or two regions: those tags. Three or more regions:
#             region:global. A comparison inside one region gets that region.
#             A work whose text names no place gets no region tag.
#   country   Each country the work studies as a case, up to five, together
#             with its region. Works that name more than five countries get
#             the regions only.
#   method    Only when the work itself states its method; more than one is
#             allowed. Not found: no method tag.
#   type      Exactly one.
#   oa        oa:yes when the work is free to read. Otherwise no oa tag.
#   todo      Notes for the editor, to look at one day in Zotero. They are never
#             shown on the site and never hold a work back.
#   Year, journal and authors are not tags. They come from Zotero's own fields.
#
# The order of the tags below is the order in which they are shown on the
# site. Countries are the exception: the site sorts them by name.

version: 3
date: "2026-10-02"

facets:

  # ------------------------------------------------------------------
  # Axis A: how the work defines populism
  # ------------------------------------------------------------------
  approach:
    label: "Approaches to populism"
    about: "How the work defines populism."
    tags:
      - tag: "approach:ideational"
        label: "Ideational"
        definition: "Populism as a thin-centred ideology, or set of ideas, that sets a pure people against a corrupt elite and wants politics to express the general will (Mudde, Hawkins)."
      - tag: "approach:discursive"
        label: "Discursive"
        definition: "Populism as a discourse or political logic that links unmet demands into ‘the people’ and sets it against those in power (Laclau, Mouffe, the Essex school)."
      - tag: "approach:political-strategic"
        label: "Political-strategic"
        definition: "Populism as a way of winning and using power, in which a personalistic leader relies on direct, unmediated support from a large and mostly unorganised following (Weyland)."
      - tag: "approach:performative"
        label: "Performative or stylistic"
        definition: "Populism as a political style that is performed: appeals to ‘the people’ against ‘the elite’, ‘bad manners’, and the staging of crisis or threat (Moffitt)."
      - tag: "approach:socio-cultural"
        label: "Socio-cultural"
        definition: "Populism as the flaunting of the ‘low’ in politics: manners, speech and tastes close to ordinary people, set against a ‘high’ that is polished and distant (Ostiguy)."
      - tag: "approach:economic"
        label: "Economic or structural"
        definition: "Populism defined by economic policy or social structure: redistribution and spending that play down economic limits (Dornbusch and Edwards), or a cross-class coalition tied to a stage of development."
      - tag: "approach:measurement"
        label: "Measurement and methods"
        definition: "Work on how to measure populism: attitude scales, text analysis of speeches and manifestos, expert surveys, and classifications of parties and leaders."
      - tag: "approach:other"
        label: "Other or multiple"
        definition: "An approach not listed here, or a work that compares or combines three or more approaches, such as overviews, handbooks and conceptual debates."

  # ------------------------------------------------------------------
  # Axis B: what populism is studied alongside
  # ------------------------------------------------------------------
  topic:
    label: "Populism and…"
    about: "What populism is studied alongside."
    tags:
      - tag: "topic:foreign-policy"
        label: "Foreign policy"
        definition: "What populists say and do in foreign policy: positions, decisions, diplomacy and relations with other states."
      - tag: "topic:defence-security"
        label: "Defence and security"
        definition: "Populism and defence or security policy: armed forces, military missions, defence spending, alliances, war and terrorism."
      - tag: "topic:international"
        label: "The international sphere"
        definition: "Populism beyond the state: the EU and Euroscepticism, international organisations, multilateralism, the international order, and links between populists across borders."
      - tag: "topic:parties"
        label: "Parties, leaders and movements"
        definition: "The supply side: populist parties, leaders and movements themselves, their organisation, ideas and strategy, how they compete, and how other parties respond."
      - tag: "topic:voters"
        label: "Voters and attitudes"
        definition: "The demand side: who supports populists and why, including vote choice, populist attitudes and public opinion."
      - tag: "topic:government"
        label: "Populists in government"
        definition: "What populists do in office, nationally or locally: how they govern, the policies they pass, and what changes as a result."
      - tag: "topic:spatial"
        label: "Spatial populism"
        definition: "The geography of populism: urban–rural and centre–periphery divides, regions and places ‘left behind’, and local contexts of support."
      - tag: "topic:economy-welfare"
        label: "Economy and welfare"
        definition: "Economic causes and effects of populism: globalisation, trade, crisis and inequality, economic policy, and the welfare state, including welfare chauvinism."
      - tag: "topic:media-communication"
        label: "Media and communication"
        definition: "How populists communicate and how the media treat them: rhetoric, social media, news coverage and disinformation."
      - tag: "topic:gender"
        label: "Gender"
        definition: "Populism and gender: women and men as voters, members and leaders, masculinity and femininity, family policy and LGBTQ+ issues."
      - tag: "topic:religion"
        label: "Religion"
        definition: "Populism and religion: religious identity and language in populist politics, religious voters and organisations, and secularism."
      - tag: "topic:migration"
        label: "Migration"
        definition: "Populism and migration: immigration and asylum politics, nativism, borders, integration, and attitudes to migrants."
      - tag: "topic:democracy-institutions"
        label: "Democracy and institutions"
        definition: "Populism and democracy: effects on liberal democracy, the rule of law, courts, parliaments and constitutions, democratic backsliding, and direct democracy."
      - tag: "topic:other"
        label: "Other"
        definition: "A subject not listed here, such as climate, health or science. Recurring subjects become new tags, added to this file first."

  # ------------------------------------------------------------------
  # Region: the six regions of the Monitor, plus one for everything
  # that is not tied to one or two of them
  # ------------------------------------------------------------------
  region:
    label: "Region"
    about: "Where the populism studied takes place."
    tags:
      - tag: "region:europe"
        label: "Europe"
        definition: "The EU and the rest of Europe: the United Kingdom, the Western Balkans, Ukraine, Belarus, Moldova, Russia, Turkey and the South Caucasus."
      - tag: "region:north-america"
        label: "North America"
        definition: "The United States and Canada."
      - tag: "region:latin-america"
        label: "Latin America"
        definition: "Mexico, Central America, the Caribbean and South America."
      - tag: "region:asia-pacific"
        label: "Asia-Pacific"
        definition: "Central, South, South-East and East Asia, Australia, New Zealand and the Pacific islands."
      - tag: "region:mena"
        label: "Middle East and North Africa"
        definition: "North Africa from Morocco to Egypt, and the Middle East from Israel and Palestine to the Gulf states, Yemen and Iran."
      - tag: "region:sub-saharan-africa"
        label: "Sub-Saharan Africa"
        definition: "Africa south of the Sahara, including Sudan and the Horn of Africa."
      - tag: "region:global"
        label: "Global or no regional focus"
        definition: "Works that cover three or more regions, or no region in particular, such as theory and concept work."

  # ------------------------------------------------------------------
  # Country: every country, each tied to one region.
  # The 193 member states of the United Nations, plus four others that
  # the literature treats as cases: the Holy See, Kosovo, Palestine and
  # Taiwan. Being on this list says nothing about legal status.
  # Countries have a name and a region, and no definition.
