  # ------------------------------------------------------------------
  # Method: how the work studies its subject
  # ------------------------------------------------------------------
  method:
    label: "Method"
    about: "How the work studies its subject."
    tags:
      - tag: "method:qualitative"
        label: "Qualitative"
        definition: "Case studies, interviews, fieldwork, process tracing, archival work, and qualitative discourse or content analysis."
      - tag: "method:quantitative"
        label: "Quantitative"
        definition: "Statistical analysis of numerical data such as election results, votes in parliament, expert surveys or economic indicators. Surveys, experiments and text-as-data have their own tags."
      - tag: "method:qta"
        label: "Text-as-data (QTA)"
        definition: "Quantitative text analysis: dictionaries, scaling, topic models, machine learning and language models applied to speeches, manifestos, social media or news."
      - tag: "method:survey"
        label: "Survey"
        definition: "Analysis of survey data on citizens or elites, including scales of populist attitudes."
      - tag: "method:experiment"
        label: "Experiment"
        definition: "Survey, conjoint, laboratory or field experiments."
      - tag: "method:mixed"
        label: "Mixed methods"
        definition: "Qualitative and quantitative methods combined in one design."

  # ------------------------------------------------------------------
  # Type: what kind of publication it is.
  # "zotero" is the name of the matching item type inside Zotero, so the
  # scripts can check that the tag and the Zotero record agree.
  # ------------------------------------------------------------------
  type:
    label: "Type of publication"
    about: "What kind of publication it is."
    tags:
      - tag: "type:article"
        label: "Journal article"
        definition: "An article in an academic journal, including review articles."
        zotero: ["journalArticle"]
      - tag: "type:book-review"
        label: "Book review"
        definition: "A review of a book, published in a journal."
        zotero: ["journalArticle"]
        guess: false          # Zotero holds a review as a journal article: without this tag a journal article is taken as an article
      - tag: "type:book"
        label: "Book"
        definition: "A monograph, or an edited volume as a whole."
        zotero: ["book"]
      - tag: "type:chapter"
        label: "Book chapter"
        definition: "A chapter in an edited volume or handbook."
        zotero: ["bookSection"]
      - tag: "type:policy-paper"
        label: "Policy paper"
        definition: "A report or brief from a think tank, an international organisation or a public body."
        zotero: ["report"]
      - tag: "type:working-paper"
        label: "Working paper"
        definition: "A working paper or preprint not yet published in a journal or book."
        zotero: ["report", "preprint"]
      - tag: "type:dataset"
        label: "Dataset"
        definition: "A published dataset, with its codebook."
        zotero: ["dataset"]

  # ------------------------------------------------------------------
  # Open access: one tag. No tag means "not known to be free to read".
  # ------------------------------------------------------------------
  oa:
    label: "Open access"
    about: "Whether the work is free to read."
    tags:
      - tag: "oa:yes"
        label: "Open access"
        definition: "The work is free to read, at the publisher or as a legal copy in a repository."

  # ------------------------------------------------------------------
  # Notes for the editor: things to look at one day in Zotero.
  # These tags are never shown on the site and never hold a work back.
  # In the Zotero app, a click on one of them lists the works to look at.
  # ------------------------------------------------------------------
  todo:
    label: "For the editor"
    about: "Things the editor wants to look at in Zotero. Not shown on the site."
    internal: true
    tags:
      - tag: "todo:check-outlet"
        label: "Check the outlet"
        definition: "The work is in an outlet that may not be peer-reviewed; the editor decides whether it stays."
      - tag: "todo:check-tag"
        label: "Check a tag"
        definition: "One of the tags rests on thin evidence; the editor confirms or removes it."
      - tag: "todo:check-record"
        label: "Check the record"
        definition: "The record has a gap or a slip, such as a missing DOI, a wrong page range or a glued publisher name; the editor corrects it in Zotero."
