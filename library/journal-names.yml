# Journal names that arrived in more than one spelling.
#
# Set "keep" to the journal's real name, as the journal itself writes it.
# Do not go by whichever spelling is commoner here: that only shows how the
# metadata happened to land. Leave keep as ? to pass a journal over for now.
#
# Then: ZOTERO_API_KEY=... python3 scripts/tidy_journals.py --apply
#
# CHECKED against the ISSN register: Communication Culture & Critique,
# Enterprise & Society, Journal of Elections Public Opinion and Parties,
# Rhetoric & Public Affairs.
# NOT CHECKED, my judgement only: the eight where the question is a leading
# "The". Change any of them if you know better. Nothing here is final: if a
# name turns out wrong, edit this file and run it again.

- group: acta politologica
  keep: Acta Politologica
  #   1x  Acta Politologica
  #   1x  ACTA POLITOLOGICA

- group: british journal of criminology
  keep: The British Journal of Criminology
  #   3x  British Journal of Criminology
  #   3x  The British Journal of Criminology

- group: communication culture and critique
  keep: Communication, Culture & Critique
  #   8x  Communication, Culture and Critique
  #   2x  Communication, Culture & Critique

