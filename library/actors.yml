# PopuliVerse Library: regions, countries, leaders and parties.
# Version 3, 2026-10-02 (version 1: 2026-10-01). It belongs with taxonomy.yml and phrases.yml.
# New in version 2: "needs" for Georgia, and two more wordings to ignore ("African American", "New Mexico").
# New in version 3 (batch 09): one more wording to ignore ("New South Wales", which is not Wales). And scripts/code_works.R
# no longer takes the longer name of another country for a country: "Northern Ireland" is not Ireland.
#
# WHAT IT IS FOR
#   scripts/code_works.R gives a region or a country tag only when the title or
#   the abstract of a work names it. This file says which words name which country.
#   Every country of taxonomy.yml is also found by its own name; the list below
#   adds other names, adjectives, leaders and parties.
#
# HOW TO READ AN ENTRY
#   names       other names of the country (capital letters and accents do not matter)
#   exact       short forms that must be written exactly so ("US", not "us")
#   adjectives  count only when a political word follows ("Italian government",
#               not "Italian" alone); the political words are listed in "after_adjective"
#   actors      leaders and parties, written exactly so (accents do not matter)
#   needs       the country's own name counts only when one of these words is also in the
#               title or the abstract (Georgia is also a state of the United States)
#
# HOW MUCH EVIDENCE IS NEEDED
#   One mention in the title, or two in the abstract. A work that names more than
#   five countries gets its regions only. Three or more regions become
#   "Global or no regional focus"; so do the "global" wordings below.
#   A work whose text names no place gets no region tag.
#
# The leaders and parties were entered by hand from common knowledge (Orbán is
# Hungary, Podemos is Spain). The list can be extended or checked against PopuList.

version: 3
date: "2026-10-02"

after_adjective: ["government*", "politic*", "part*", "election*", "elector*", "voter*", "populis*", "foreign polic*",
                  "case", "president*", "prime minister*", "parliament*", "left", "right", "far right", "radical right",
                  "societ*", "public", "democrac*", "state", "econom*", "military", "diplomac*", "media", "context",
                  "leader*", "citizen*", "nationalis*", "administration*", "regime", "experience", "minist*",
                  "polic*", "national*", "identity", "people", "campaign*", "movement*", "attitude*", "press"]

# Wordings removed before anything is looked for, so they cannot mislead.
ignore: ["latin american", "north american", "south american", "central american", "vox populi",
         "new england", "georgia state", "american journal", "european journal", "british journal",
         "african american*", "new mexico", "new south wales"]

regions:
  "region:europe": ["europe", "european", "western europe*", "eastern europe*", "central europe*",
                    "southern europe*", "northern europe*", "nordic", "scandinavia*", "balkan*", "visegrad"]
  "region:north-america": ["north america"]
  "region:latin-america": ["latin america", "south america", "central america", "caribbean", "andes", "andean", "mercosur"]
  "region:asia-pacific": ["asia", "asian", "asia pacific", "southeast asia*", "south asia*", "east asia*",
                          "central asia*", "oceania", "asean"]
  "region:mena": ["middle east*", "north africa*", "arab", "maghreb", "gulf states", "persian gulf"]
  "region:sub-saharan-africa": ["sub saharan africa*", "africa", "african"]
  "region:global": ["global south", "global north", "worldwide", "around the world", "across the world",
                    "across the globe", "cross regional", "world regions", "global rise", "global populism*"]
regions_exact:
  "region:europe": ["EU"]
  "region:mena": ["MENA"]

countries:
  "country:united-states": {exact: ["US", "USA", "U.S.", "U.S"], names: ["united states"], adjectives: ["american"],
                            actors: ["Trump", "Trumpism", "Trumpian", "Bernie Sanders", "Sanders", "Tea Party", "MAGA", "America First", "Jacksonian", "Obama", "Biden"]}
  "country:canada": {adjectives: ["canadian"]}
  "country:mexico": {adjectives: ["mexican"], actors: ["López Obrador", "AMLO", "Morena"]}
  "country:brazil": {adjectives: ["brazilian"], actors: ["Bolsonaro", "Bolsonarismo", "Lula", "Itamaraty"]}
  "country:argentina": {adjectives: ["argentine", "argentinian", "argentinean"], actors: ["Kirchner", "Kirchnerism", "Perón", "Peronism", "Peronist", "Menem", "Milei", "Macri"]}
  "country:venezuela": {adjectives: ["venezuelan"], actors: ["Chávez", "Chavismo", "Chavista", "Maduro", "Bolivarian"]}
  "country:bolivia": {adjectives: ["bolivian"], actors: ["Evo Morales", "Morales"]}
