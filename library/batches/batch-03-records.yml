# Batch 03: what was decided by reading, not by the automatic lookup.
# Checked by the editor on 9 October 2026: all 4 works listed under read and accepted in this file were read again and kept (library/batches/records-check-2026-10-09.csv).
# Source: the reference lists of the Routledge Handbook of Populism and Foreign
# Policy (2025). Written by Claude on 2026-10-01; every work below also gets the
# note "todo:check-record" in Zotero, for the editor's own pass.
#
# accepted  References the lookup did not match by its strict rule, but whose
#           nearest catalogue record is the same work for the reason given.
# records   Works for which no DOI is confirmed. Each record repeats the
#           handbook's reference as printed there (names, year, title, journal or
#           publisher, volume, issue, pages). Nothing was added from memory.
# remove    Two records of batch 02 that are not the works cited: the lookup had
#           matched two books to reviews of those books, which carry the same
#           title. They are to be moved to the bin in Zotero; the books
#           themselves are among the records below.

# The note written into each created record in Zotero (field "Extra").
note: "Record made from the reference list of the Routledge Handbook of Populism and Foreign Policy (2025); not yet checked against the publication."

accepted:
  H0048: {doi: "10.1177/13540661221095945", why: "same three authors and year; the journal's number (1354-0661, European Journal of International Relations) is in the DOI; the title differs by one word"}
  H0078: {doi: "10.17645/pag.8180", why: "same authors and year; the article number 8180 of the reference is in the DOI (Politics and Governance)"}
  H0079: {doi: "10.1111/j.1477-7053.1968.tb01332.x", why: "same title and year; the journal's number (1477-7053, Government and Opposition) is in the DOI; the catalogue record names no author"}
  H0290: {doi: "10.3167/gps.2016.340401", why: "same authors and year; German Politics and Society, volume 34, issue 4, first article, as in the DOI; the catalogue title lacks the word Introduction"}

remove:
  - {key: "T8Q2ZF89", doi: "10.2307/2513934", why: "a review of Germani 1978 in The Hispanic American Historical Review, not the book"}
  - {key: "W33MVSEJ", doi: "10.2307/2211330", why: "a review of Kazin 1998 in The Journal of Southern History, not the book"}

# Abstracts that batch 02 wrote into Zotero from the lookup and that are not
# whole: cut off, or not an abstract at all. They are taken out again, so these
# works show no abstract until the editor adds the published one. Nothing else
# in those records changes; an abstract that has been repaired by hand is kept.
clear_abstract:
  - {doi: "10.24425/pyil.2023.147177", why: "ends in the middle of a word"}
  - {doi: "10.1057/9781403920072", why: "cut after 200 characters"}
  - {doi: "10.1017/s1537592721001924", why: "ends without closing its last sentence"}
  - {doi: "10.2307/20433986", why: "ends in the middle of a sentence"}
  - {doi: "10.3817/0395103009", why: "not the abstract of this work (it cites writings of 2015 for a work of 1995)"}
  - {doi: "10.2307/422236", why: "ends in the middle of a sentence"}
  - {doi: "10.4135/9781446270073", why: "a list of chapter titles, not an abstract"}

