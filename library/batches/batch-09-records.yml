  - {cite: "Dorraj and Dodson 2009", doi: "10.1215/1089201x-2008-049", title: "Neo-Populism in Comparative Perspective: Iran and Venezuela", year: 2009, tags: ["region:latin-america", "region:mena", "country:venezuela", "country:iran", "type:article"], why: "the region \"global\" came from the name of the journal in a text that is the publisher's web page, not the abstract; the title names Iran and Venezuela: the two regions of these countries stand in its place"}
