# Batch 04: what was decided by reading, not by the automatic lookup.
# Sources: the reference lists of three review articles of 2026 (Bliuc et al.,
# Information, Communication & Society; Tóth et al., Annals of the International
# Communication Association; Yilmaz et al., new media & society). Written by
# Claude on 2026-10-01; every work below also gets the note "todo:check-record"
# in Zotero, for the editor's own pass.
#
# titles    A title as the source prints it, where the reading of the list had cut it short.
# drop      References left out by reading.
# accepted  References the lookup did not match by its strict rule, but whose DOI
#           is the same work for the reason given.
# records   Works for which no DOI is confirmed: each record repeats the source's
#           reference as printed (names, year, title, journal or publisher, volume,
#           issue, pages). Nothing was added from memory. Two records carry a DOI
#           printed in the source: they are used only if Zotero cannot fetch that DOI.

# The note written into each created record in Zotero (field "Extra").
note: "Record made from the reference list of a review article of 2026 (Bliuc et al.; Tóth et al.; Yilmaz et al.); not yet checked against the publication."

