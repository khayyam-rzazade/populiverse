  S0092: {doi: "10.1177/1940161218786786", why: "same authors and year; the journal's number (1940-1612, The International Journal of Press/Politics) is in the DOI; the catalogue title lacks one word"}
  S0101: {doi: "10.17645/mac.v10i4.5654", why: "same author, year and title; the article number 5654 of the address printed in the source is in the DOI"}
  S0135: {doi: "10.3318/isia.2017.28.9", why: "same title and author; the source names another journal and year (International Journal of Intelligence and Counterintelligence, 2019), the catalogue has Irish Studies in International Affairs 28 (2017)"}

