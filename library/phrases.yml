# PopuliVerse Library: the phrases that count as evidence for each tag.
# Version 6, 2026-10-03 (version 2 of 2026-10-01 added the rule on review articles; version 3 removes two more wordings before "war" is looked for;
# version 4, with batch 08: more wordings removed before "war" and before "interview" are looked for, and "opinion poll" no longer counts as a survey;
# version 5, with batch 09, the works before 2008: wordings removed that gave a wrong tag there, among them "the Civil War" as a date,
# a "regression" that is a decline, and a "populist president" of a trade union;
# version 6: a second test for the tag "Parties, Leaders and Movements", see "HOW MUCH EVIDENCE IS NEEDED" and the tag itself;
# version 7, after the audit of 400 works of 5 October 2026: the second test of version 6 no longer blocks a title that
# names a party, a party family or a leader; "rhetoric*" no longer gives "Media and Communication"; and a few phrases
# too general to stand alone are listed under "weak", see "A PHRASE THAT CANNOT STAND ALONE").
# It belongs with taxonomy.yml (the tags) and actors.yml (countries, leaders and parties).
#
# HOW IT WORKS
#   scripts/code_works.R reads the title and the abstract of each work and gives
#   a tag only when one of the phrases below is found. It records which phrase
#   was found. Nothing else decides a tag.
#
# HOW TO READ A PHRASE
#   - Capital letters, accents, hyphens and quotation marks do not matter:
#     "thin-centred" also finds "Thin Centred".
#   - A star stands for any ending: "populis*" finds populism, populist, populists.
#   - "not:" lists wordings that are removed first, so they cannot trigger the tag
#     (for example "cold war" before looking for "war").
#
# HOW MUCH EVIDENCE IS NEEDED
#   approach  one phrase, in the title or in the abstract.
#   topic     one phrase in the title, or two phrases in the abstract.
#             "Parties, Leaders and Movements" must pass a second test as well
#             (since version 6): it is written out under "topic:parties" below.
#   method    one phrase in the title, or one in a sentence of the abstract that
#             speaks about the study itself (it contains one of the "study words").
#             For a review article (see "review_titles") the title alone counts.
#   Region and country are in actors.yml.
#
# A PHRASE THAT CANNOT STAND ALONE (since version 7)
#   A tag may list some of its phrases again under "weak". A weak phrase is too general to carry
#   the tag by itself: "war" and "military" stand in many texts that are not about defence. In an
#   ABSTRACT such a phrase counts only when a phrase of the same tag that is not weak is found too.
#   A TITLE is left alone: a word in a title is there on purpose, and "Populism and the Russian
#   Civil War" is about a war. A weak phrase still counts towards the two needed in the abstract.
#
#   Three or more approaches found in one work become "Other or multiple".
#   A work found to use mixed methods gets "Mixed methods" only, not also
#   "Qualitative" or "Quantitative".

version: 7
date: "2026-10-05"

# Outlets that may not be peer-reviewed. A work in one of them stays in the
# Library and gets the note "todo:check-outlet" for the editor (never shown on
# the site). The name must be written as the catalogue writes it.
outlets_to_check: ["Foreign Affairs", "Journal of Democracy", "The Brown Journal of World Affairs",
                   "SAIS Review of International Affairs", "The Fletcher forum of world affairs",
                   "The Fletcher Forum of World Affairs", "Survival",
                   "Sigma: Journal of Political and International Studies", "Comparative Politics Newsletter",
                   "Global Politics Review"]

# A review article describes the methods of the studies it reviews, so its
# abstract gives no evidence for its own method: when the title holds one of
# these wordings, a method tag can come from the title only.
review_titles: ["review", "meta analysis", "meta research", "state of the art", "state of the field"]

# A sentence of the abstract counts for method only if it holds one of these.
study_words: ["we", "our", "this article", "this paper", "this study", "this essay", "this book",
              "the article", "the paper", "the study", "the analysis", "drawing on", "draws on",
              "based on", "using", "uses", "use", "employ*", "conduct*", "rely*", "relies",
              "analys*", "analyz*", "examin*", "test*", "evidence from", "data from"]

approach:
  "approach:ideational":
    phrases: ["ideational approach*", "ideational definition*", "ideational perspective*", "ideational theor*",
              "ideational framework", "ideational conception*", "ideational understanding", "ideational lens",
              "thin centred", "thin centered", "thin ideology", "thin ideologies", "thick ideology", "thick ideologies",
              "host ideology", "host ideologies", "populism as an ideology", "populism as a thin*",
              "populism as a set of ideas"]
  "approach:discursive":
    phrases: ["discourse theor*", "discourse theoretical", "discursive approach*", "discursive perspective",
              "discursive conception*", "discursive logic", "discursive construction*", "discursively construct*",
              "populism as a discourse", "populism as discourse", "populism as a discursive*", "populism as a political logic", "populist logic",
              "laclau*", "essex school", "empty signifier*", "chain of equivalence", "chains of equivalence",
              "equivalential", "logic of equivalence", "post structuralis*", "poststructuralis*", "post foundational"]
  "approach:political-strategic":
    phrases: ["populism as a political strategy", "populism as a strategy", "populism as political strategy",
              "political strategic", "politico strategic", "strategic approach*", "strategic definition",
              "strategic conception", "plebiscitarian*", "populism is a strategy", "populism is an elite strategy",
              "populism as an electoral strategy"]
    # since version 5 (batch 09): a structural account of populism, not the strategic approach
    not: ["populism is a strategy for capital accumulation"]
  "approach:performative":
    phrases: ["political style", "populist style", "populism as a style", "populism as style", "stylistic approach",
              "stylistic turn", "performative", "performativity", "performance of crisis", "performances of crisis",
              "bad manners", "populist performance*", "politics as performance"]
  "approach:socio-cultural":
    phrases: ["socio cultural approach", "sociocultural approach", "socio cultural dimension", "high low axis",
              "high low divide", "high low dimension", "flaunting of the low", "ostiguy*"]
  "approach:economic":
    phrases: ["macroeconomics of populism", "macroeconomic populism", "economic populism", "populist macroeconomic*"]
  "approach:measurement":
    phrases: ["measuring populis*", "measure populis*", "measures of populis*", "measurement of populis*",
              "measure of populis*", "measuring populist*", "populist attitudes scale", "populism scale*",
              "index of populis*", "populism index", "operationali* populis*", "operationali* of populis*",
              "how to measure", "new measure*", "measurement invariance", "measurement validity"]
  "approach:other":
    phrases: ["approaches to populism", "definitions of populism", "conceptuali* of populism",
              "conceptions of populism", "understandings of populism", "competing approaches",
              "different approaches", "theories of populism", "conceptual approaches"]

topic:
  "topic:foreign-policy":
    phrases: ["foreign polic*", "foreign relations", "external relations", "external action", "diplomacy",
              "diplomatic", "diplomat", "diplomats", "foreign minist*", "international relations of"]
  "topic:defence-security":
    phrases: ["defence polic*", "defense polic*", "defence spending", "defense spending", "defence budget*",
              "defense budget*", "security and defence", "security and defense", "defence cooperation",
              "defense cooperation", "security polic*", "national security", "security narrative*", "military",
              "militar*", "armed forces", "armed conflict*", "international conflict*", "international dispute*",
              "use of force", "nato", "nuclear weapon*", "nuclear deterrence", "nuclear proliferation", "war", "wars",
              "warfare", "terroris*", "peacekeeping", "peacemaking", "peace process*", "arms control", "arms export*",
              "securiti*ation", "securiti*ing", "security threat*"]
    # Too general to carry the tag alone (version 7). Of the works holding this tag, 41 per cent rested
    # on nothing but these two words: a conceptual history of the word populism, a book on zombie films.
    weak: ["war", "wars", "military"]
    not: ["cold war", "culture war*", "trade war*", "class war*", "post war", "postwar", "world war", "inter war", "interwar",
          "war on science", "mention the war",
          # since version 4 (batch 08): a period, a figure of speech or a name, not a war
          "pre war", "prewar", "civil war era", "dirty war", "war on human rights", "cultural war*", "oil war*",
          "immigration war*", "wal mart wars",
          # since version 7: more figures of speech
          "ideological war*", "war of words", "war of position*", "war of ideas", "culture of war",
          "war on drugs", "war on terror rhetoric", "waging war on", "at war with itself",
          # since version 5 (batch 09): the American Civil War named as a date or in the title of a book, and a figure of speech
          "the civil war", "war on the southern railway"]
  "topic:international":
    phrases: ["european union", "eu", "euroscepti*", "european integration", "brexit", "european parliament",
              "international organi*ation*", "international institution*", "multilateral*", "global governance",
              "international order", "world order", "liberal order", "global order", "united nations",
              "world trade organi*ation", "wto", "international monetary fund", "imf", "international law",
              "international court*", "international cooperation", "regional integration", "regional organi*ation*",
              "regionalism", "transnational*", "international populism", "supranational*"]
    # since version 5 (batch 09): the regionalism of a province, not of states
    not: ["regionalism and populism in the russian civil war"]
  "topic:parties":
    phrases: ["party", "parties", "party system*", "party competition", "partisan*", "populist leader*",
              "political leader*", "party leader*", "populist movement*", "social movement*", "populist actor*",
              "populist politician*", "candidate*", "manifesto*", "radical right", "far right", "radical left",
              "populist right", "populist left", "right wing populis*", "left wing populis*"]
    # THE SECOND TEST (since version 6, 2026-10-03). Words such as "party" and "radical right" stand in
    # almost every text on populism, so the phrases above gave this tag to many works that are about
    # voters or about something else. A work that passes the usual rule now keeps the tag only if
    #   A. its TITLE is not about voters only. Until version 7 any "title_blocks" word blocked the tag,
    #      which was wrong: a title can be about voters AND about parties ("support for populist radical
    #      right parties"). Since version 7 a "title_blocks" word blocks the tag only when the title holds
    #      no "title_words", no "title_families" and no leader or party of actors.yml. The audit of
    #      5 October 2026 found 371 works had lost the tag wrongly this way. And
    #   B. one of these is true:
    #      1. the title holds one of the "title_words";
    #      2. the title names a leader or a party listed in actors.yml;
    #      3. the title names a party family ("title_families"), unless the abstract speaks mostly of
    #         voters: three or more "abstract_counter" words, and at least as many as "abstract_phrases";
    #      4. the abstract holds two or more "abstract_phrases", and more of them than
    #         "abstract_counter" words.
    # Tested on 3 October 2026 on works that carried the tag: of the clear cases, about 6 to 7 in 10
    # were right before, and 9 in 10 of those that keep the tag (120 works read to write the test,
    # 50 others to try it; the reader was Claude). The decision log of the master plan has the detail.
    second_test:
      title_blocks: ["vote", "votes", "voted", "voting", "voter*", "electorate*", "electoral support", "support for",
                     "supporters", "attitudes", "public opinion", "demand for", "demand side", "publics", "audience*"]
      title_words: ["party", "parties", "party system*", "partisan*", "leader*", "leadership", "politician*", "movement*",
                    "manifesto*", "candidate*", "mps", "parliamentarian*", "legislator*"]
      title_families: ["radical right", "far right", "radical left", "far left", "populist right", "populist left",
                       "extreme right", "populist actor*", "populist radical right", "right wing populists",
                       "left wing populists", "populists in"]
      abstract_phrases: ["populist part*", "populist radical right part*", "radical right part*", "far right part*",
                         "radical left part*", "right wing part*", "left wing part*", "right wing populist part*",
                         "left wing populist part*", "political part*", "mainstream part*", "established part*", "niche part*",
                         "challenger part*", "anti establishment part*", "opposition part*", "governing part*", "ruling part*",
                         "new part*", "other part*", "party system*", "party competition", "party organi*", "party strateg*",
                         "party leader*", "party polit*", "party member*", "party famil*", "party position*", "party manifesto*",
                         "party program*", "party platform*", "party ideolog*", "party discourse*", "party communication",
                         "manifesto*", "populist leader*", "political leader*", "leadership", "populist movement*",
                         "social movement*", "populist actor*", "populist politician*", "politicians", "populist candidate*",
                         "the party", "parties", "party s"]
      abstract_counter: ["vote", "votes", "voted", "voting", "voter*", "electorate*", "electoral support", "support",
                         "supporters", "attitudes", "demand", "preference*", "public opinion", "citizens", "respondents",
                         "survey experiment", "experiment*"]

  "topic:voters":
    phrases: ["voter*", "voting behavio*", "vote choice", "electorate*", "electoral support", "public opinion",
              "populist attitudes", "attitudes", "citizens", "mass public", "demand side", "supporters",
              "support for populis*", "public support", "respondents"]
  "topic:government":
    phrases: ["populists in government", "populists in power", "populists in office", "populist government*",
              "populist rule", "populist incumbent*", "populist administration*", "populist president*",
              "populist prime minister*", "populism in power", "populism in government", "populist governance",
              "populist led government*", "ruling populis*", "governing populis*", "populist governing",
              "populists govern", "in government", "in office", "in power", "came to power", "come to power",
              "coming to power", "administration", "presidency", "incumbent*"]
    # since version 5 (batch 09): the president of a trade union
    not: ["populist president of the american federation of labor"]
  "topic:spatial":
    phrases: ["urban rural", "rural urban", "rural", "geography of", "geographies of", "geographical",
              "spatial", "left behind places", "left behind regions", "left behind areas", "places that don t matter",
              "centre periphery", "center periphery", "subnational", "territorial inequal*", "territorial divide*"]
  "topic:economy-welfare":
    phrases: ["economy", "economic", "economics", "welfare", "trade polic*", "trade agreement*", "trade war*",
              "international trade", "free trade", "protectionis*", "globali*ation", "inequalit*", "redistribut*",
              "austerity", "financial crisis", "economic crisis", "euro crisis", "eurozone crisis", "neoliberal*",
              "unemployment", "fiscal", "tariff*", "labour market*", "labor market*", "social polic*",
              "development aid", "development polic*", "foreign aid", "energy polic*", "energy transition"]
  "topic:media-communication":
    # "rhetoric*" was removed in version 7. It fired 582 times, third of all the phrases here, and the
    # audit found it was the commonest single cause of a wrong tag: a rhetorical analysis of a
    # parliamentary debate, a reading of Marlowe, a paper on Laclau. Rhetoric is not a medium.
    phrases: ["media", "communication*", "twitter", "tweet*", "facebook", "social network*",
              "news coverage", "newspaper*", "journalis*", "disinformation", "misinformation", "fake news",
              "propaganda", "television", "press coverage", "public diplomacy", "framing", "frames"]
  "topic:gender":
    phrases: ["gender*", "women", "feminis*", "masculin*", "lgbt*", "sexualit*", "family polic*", "anti gender",
              "patriarch*", "misogyn*"]
  "topic:religion":
    phrases: ["religio*", "christian*", "islam", "islamic", "islamis*", "muslim*", "catholic*", "church*",
              "evangelical*", "hindu*", "orthodox church", "secular*", "sacred"]
  "topic:migration":
    phrases: ["migra*", "immigra*", "refugee*", "asylum", "border control*", "border polic*", "border security",
              "nativis*", "xenophob*", "anti immigr*", "diaspora*"]
  "topic:democracy-institutions":
    phrases: ["democratic backsliding", "democratic erosion", "democratic decline", "democratic quality",
              "quality of democracy", "democratic institutions", "democratic norms", "democrati*ation",
              "autocrati*ation", "liberal democracy", "liberal democracies", "illiberal*", "authoritarian*",
              "rule of law", "judicia*", "constitution*", "courts", "court", "checks and balances",
              "direct democracy", "referendum*", "referenda", "hybrid regime*", "populism and democracy",
              "threat to democracy", "parliamentary oversight", "parliamentary control"]

method:
  "method:qualitative":
    phrases: ["qualitative", "interview*", "semi structured", "ethnograph*", "fieldwork", "field research",
              "process tracing", "focus group*", "discourse analysis", "critical discourse analysis",
              "participant observation", "archival", "in depth case stud*", "comparative case stud*",
              "within case", "narrative analysis", "interpretive analysis"]
    not: ["qualitative comparative analysis",
          # since version 4 (batch 08): a piece that is an interview, or that studies interviews in the news
          "an interview", "interview with", "news interview*", "interviewing a",
          # since version 5 (batch 09): a piece about a kind of research, or one that calls for a method, is not a study that uses it
          "qualitative audience research", "qualitative audience studies", "political discourse analysis and cultural studies"]
  "method:quantitative":
    phrases: ["regression*", "panel data", "time series", "statistical analys*", "quantitative analys*",
              "quantitative evidence", "quantitative study", "quantitative data", "large n", "multilevel model*",
              "logit", "probit", "difference in differences", "econometric*", "roll call*", "expert survey*",
              "voting records", "event study", "structural equation"]
    # since version 5 (batch 09): a decline called a regression, and a sentence about another author's method
    not: ["regression from", "analysis of quantitative data could"]
  "method:qta":
    phrases: ["text as data", "quantitative text analysis", "automated text analysis", "automated content analysis",
              "computational text analysis", "topic model*", "word embedding*", "dictionary based",
              "sentiment analysis", "wordscores", "wordfish", "natural language processing", "text mining",
              "semantic text analysis", "supervised machine learning", "machine learning classif*"]
  "method:survey":
    phrases: ["survey data", "survey evidence", "survey respondents", "survey items", "survey research",
              "original survey*", "online survey*", "national survey*", "representative survey*", "panel survey*",
              "public opinion survey*", "cross national survey*", "nationally representative", "survey based",
              "european social survey", "eurobarometer", "world values survey", "latinobarometro",
              "american national election stud*", "polling data", "election stud*"]
    # ("opinion poll*" was a phrase until version 3: polls are often named without being the work's own method)
    not: ["expert survey*", "survey experiment*"]
  "method:experiment":
    phrases: ["survey experiment*", "conjoint", "vignette experiment*", "experimental design", "experimental evidence",
              "experimental study", "experimental data", "experimental results", "field experiment*",
              "laboratory experiment*", "lab experiment*", "online experiment*", "randomi*ed", "pre registered experiment*",
              "conducted an experiment", "conduct an experiment", "two experiments", "three experiments"]
  "method:mixed":
    phrases: ["mixed method*", "multi method*", "multimethod", "qualitative and quantitative", "quantitative and qualitative"]
