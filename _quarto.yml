# PopuliVerse: settings for the whole site.
# Lines that start with # are notes for people. Quarto ignores them.

project:
  type: website
  # Only .qmd files become pages. The drafts folder is never built.
  render:
    - "*.qmd"
    - "!drafts/"
    # The Workspace's server is code for Cloudflare, not pages of the site.
    - "!server/"
  # Before every render: writes the actor and country pages from the Monitor's
  # tags. See scripts/make_pages.py.
  pre-render:
    - python3 scripts/make_pages.py
  # After every render: takes the two newsletter pages out of sitemap.xml and
  # writes robots.txt with a User-agent line. See scripts/finish_site.py.
  post-render:
    - python3 scripts/finish_site.py
  # The typeface files are copied into the built site as they are.
  resources:
    - "fonts/"
    # The one rule about where a link opens. See the notes inside the file.
    - "links.js"
    # The visit counter's page script. See the notes inside the file.
    # The slash at the start means the file in the top folder only, so the
    # server's own files of the same name (server/src/) are never copied.
    - "/counter.js"
    # "Save" and "Note" on the things of the site. The script does nothing at
    # all unless the browser carries the mark the Workspace leaves when a person
    # signs in. See the notes inside the file.
    - "/keep.js"
    # The picture shown when a link to the site is shared (LinkedIn, messages).
    - "populiverse-card.png"
    # The script of "Actors in Monitor" and "Countries in Monitor", and of the
    # upper part of each actor's and each country's page.
    - "data/monitor-pages.js"
    # The script of "Events in Monitor", the Monitor as a dataset.
    - "data/events.js"

lang: en-GB

# Under every list of issues Quarto keeps a hidden line, "No matching items", for
# lists that readers can filter. Our lists have no filter, so the line is never
# shown, but search engines read it. Setting it to nothing takes the words out.
language:
  listing-page-no-matches: ""

# In the text of every page, "Verse" in the name PopuliVerse is set in italics.
# The small file verse.lua does this when the site is built.
filters:
  - verse.lua

website:
  title: "PopuliVerse"
  description: "A library of research on populism, a monthly monitor of populist actors worldwide, and short commentary by scholars."
  # The small picture in the browser tab: the letters P and V, black on white.
  favicon: favicon.png
  site-url: "https://populiverse.com"
  # When someone shares a link to any page, the preview shows this picture with
  # the page's own title and description. "open-graph" is what LinkedIn, Facebook
  # and messaging apps read; "twitter-card" is what X and Bluesky read.
  # The slash at the start means "from the top folder of the site", so every
  # page, in whatever folder, points to the same picture.
  image: "/populiverse-card.png"
  image-alt: "PopuliVerse: The Universe of Populism"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay

  # The menu at the top of every page.
  navbar:
    # The wordmark: "Populi" upright, "Verse" italic (the stars make it italic).
    title: "Populi*Verse*"
    left:
      - text: "Library"
        href: library/index.qmd
      - text: "Monitor"
        href: monitor/index.qmd
      - text: "Commentary"
        href: commentary/index.qmd
      # The data pages, and the pages of the actors and countries in the
      # Monitor (written at every build; see scripts/make_pages.py)
      - text: "Data"
        menu:
          - text: "Who Counts as Populist?"
            href: data/who-counts.qmd
          - text: "Populists in Power"
            href: data/in-power.qmd
          - text: "Actors in Monitor"
            href: actors/index.qmd
          - text: "Countries in Monitor"
            href: countries/index.qmd
          - text: "Events in Monitor"
            href: data/events.qmd
      # Resources sits under About, right after Editor. The page keeps its own
      # address, /resources/, so every link to it from outside the site and
      # every line of the sitemap still holds.
      - text: "About"
        menu:
          - text: "About Populi*Verse*"
            href: about/about.qmd
          - text: "Advisory Board"
            href: about/advisory-board.qmd
          - text: "Editor"
            href: about/editor.qmd
          - text: "Resources"
            href: resources/index.qmd
          - text: "How to Contribute"
            href: about/contribute.qmd
          - text: "Editorial Policy"
            href: about/editorial-policy.qmd
    right:
      - text: "Newsletter"
        href: newsletter/index.qmd
      # The three accounts, as small marks. The order is the same everywhere:
      # LinkedIn, Bluesky, Instagram. Each one says what it is for a screen reader.
      - icon: linkedin
        href: "https://www.linkedin.com/company/populiverse/"
        aria-label: "PopuliVerse on LinkedIn"
      - icon: bluesky
        href: "https://bsky.app/profile/populiverse.bsky.social"
        aria-label: "PopuliVerse on Bluesky"
      - icon: instagram
        href: "https://www.instagram.com/populiverse/"
        aria-label: "PopuliVerse on Instagram"
      # The Researcher's Workspace. On a wide screen it stands at the right of
      # the wordmark, beside the search, as Newsletter stands at its left; on a
      # phone it is the line above Newsletter in the menu (edition.scss).
      - text: "Workspace"
        href: workspace/index.qmd

  # The strip at the bottom of every page.
  page-footer:
    left:
      - text: "Editor and Founder: Khayyam RZAZADE"
        href: about/editor.qmd
    center:
      - text: "Privacy"
        href: legal/privacy.qmd
      - text: "Licence"
        href: legal/licence.qmd
    right:
      - text: "LinkedIn"
        href: "https://www.linkedin.com/company/populiverse/"
      - text: "Bluesky"
        href: "https://bsky.app/profile/populiverse.bsky.social"
      - text: "Instagram"
        href: "https://www.instagram.com/populiverse/"
      - text: "Contact"
        href: about/about.qmd#contact

format:
  html:
    # No outside fonts: every page is served from this site alone, with one exception,
    # the visit counter at the end of this file.
    # The look is "Edition": edition.scss holds the colours, sizes, masthead and covers;
    # styles.css declares the typeface from the files in the fonts folder.
    theme:
      - default
      - edition.scss
    css: styles.css
    html-math-method: mathml
    toc: false
    link-external-newwindow: true
    # Every page names its one official address. A filter link such as
    # library/index.html?topic=migration then counts as the Library page itself,
    # not as a second page with the same content.
    canonical-url: true
    email-obfuscation: javascript
    # The visit counter: Cloudflare Web Analytics. It sets no cookies.
    # This one line is the only thing a page loads from another company. (The
    # counter in counter.js talks to counter.populiverse.com, which is our own
    # address, run on Cloudflare too.)
    include-after-body:
      text: |
        <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "6cc8cff09da149d49c01978ce7f11555"}'></script><!-- End Cloudflare Web Analytics -->
        <!-- Where a link opens: outside the site, and our own PDFs, in a new tab. -->
        <script src="/links.js" defer></script>
        <!-- Our own visit counter: one number added per visit, see counter.js. -->
        <script src="/counter.js" defer></script>
        <!-- "Save" and "Note" for a reader who is signed in, see keep.js. -->
        <script src="/keep.js" defer></script>
