# PopuliVerse: settings for the whole site.
# Lines that start with # are notes for people. Quarto ignores them.

project:
  type: website
  # Only .qmd files become pages. The drafts folder is never built.
  render:
    - "*.qmd"
    - "!drafts/"
  # After every render: takes the two newsletter pages out of sitemap.xml and
  # writes robots.txt with a User-agent line. See scripts/finish_site.py.
  post-render:
    - python3 scripts/finish_site.py
  # The typeface files are copied into the built site as they are.
  resources:
    - "fonts/"
    # The picture shown when a link to the site is shared (LinkedIn, messages).
    - "populiverse-card.png"

lang: en-GB

# Under every list of issues Quarto keeps a hidden line, "No matching items", for
# lists that readers can filter. Our lists have no filter, so the line is never
# shown, but search engines read it. Setting it to nothing takes the words out.
language:
  listing-page-no-matches: ""

# In the text of every page, "Verse" in the name PopuliVerse is set in italics.
# The small file verse.lua does this when the site is built.
filters:
  - verse.lua

website:
  title: "PopuliVerse"
  description: "A library of research on populism, a monthly monitor of populist actors worldwide, and short commentary by scholars."
  # The small picture in the browser tab: the letters P and V, black on white.
  favicon: favicon.png
  site-url: "https://populiverse.com"
  # When someone shares a link to any page, the preview shows this picture with
  # the page's own title and description. "open-graph" is what LinkedIn, Facebook
  # and messaging apps read; "twitter-card" is what X and Bluesky read.
  # The slash at the start means "from the top folder of the site", so every
  # page, in whatever folder, points to the same picture.
  image: "/populiverse-card.png"
  image-alt: "PopuliVerse: The Universe of Populism"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay

  # The menu at the top of every page.
  navbar:
    # The wordmark: "Populi" upright, "Verse" italic (the stars make it italic).
    title: "Populi*Verse*"
    left:
      - text: "Library"
        href: library/index.qmd
      - text: "Monitor"
        href: monitor/index.qmd
      - text: "Commentary"
        href: commentary/index.qmd
      - text: "Resources"
        href: resources/index.qmd
      - text: "About"
        menu:
          - text: "About Populi*Verse*"
            href: about/about.qmd
          - text: "Advisory Board"
            href: about/advisory-board.qmd
          - text: "Editor"
            href: about/editor.qmd
          - text: "How to Contribute"
            href: about/contribute.qmd
          - text: "Editorial Policy"
            href: about/editorial-policy.qmd
    right:
      - text: "Newsletter"
        href: newsletter/index.qmd

  # The strip at the bottom of every page.
  page-footer:
    left:
      - text: "Editor: Khayyam RZAZADE"
        href: about/editor.qmd
    center:
      - text: "Privacy"
        href: legal/privacy.qmd
      - text: "Licence"
        href: legal/licence.qmd
    right:
      - text: "LinkedIn"
        href: "https://www.linkedin.com/company/populiverse/"
      - text: "Bluesky"
        href: "https://bsky.app/profile/populiverse.bsky.social"
      - text: "Instagram"
        href: "https://www.instagram.com/populiverse/"
      - text: "Contact"
        href: about/about.qmd#contact

format:
  html:
    # No outside fonts: every page is served from this site alone, with one exception,
    # the visit counter at the end of this file.
    # The look is "Edition": edition.scss holds the colours, sizes, masthead and covers;
    # styles.css declares the typeface from the files in the fonts folder.
    theme:
      - default
      - edition.scss
    css: styles.css
    html-math-method: mathml
    toc: false
    link-external-newwindow: true
    # Every page names its one official address. A filter link such as
    # library/index.html?topic=migration then counts as the Library page itself,
    # not as a second page with the same content.
    canonical-url: true
    email-obfuscation: javascript
    # The visit counter: Cloudflare Web Analytics. It sets no cookies.
    # This one line is the only thing a page loads from another company.
    include-after-body:
      text: |
        <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "6cc8cff09da149d49c01978ce7f11555"}'></script><!-- End Cloudflare Web Analytics -->
